<header id="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ "/" | relURL }}">
      <img src="https://micro.blog/{{ .Site.Params.author.username }}/avatar.jpg" alt="{{ .Site.Title }} avatar" width="35" height="35" loading="lazy">
      {{ .Site.Title }}
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
