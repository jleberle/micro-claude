{{ define "main" }}
  <h1 class="page-title">Photos</h1>
  <div class="photos-grid">
    {{ range where .Site.RegularPages "Params.photos" "!=" nil }}
      {{ with index .Params.photos 0 }}
        <a href="{{ $.Permalink }}">
          <img src="{{ . }}" alt="" loading="lazy">
        </a>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
