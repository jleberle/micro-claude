<html>
<body style="margin:0;padding:0;background:#FDF6E3;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;width:600px;height:315px;overflow:hidden;">
<table border="0" cellpadding="0" cellspacing="0" width="600" height="315">
  <tr>
    <td width="110" valign="middle" align="center" style="background:#2d3c42;padding:20px 12px;" data-avatar-background="#2d3c42">
      <img src="{{.Site.Author.avatar}}" width="72" height="72" style="border-radius:50%;border:2px solid #fffcf2;display:block;margin:0 auto 10px auto;" data-avatar-url="{{.Site.Author.avatar}}">
      <div style="color:#fffcf2;font-size:11px;font-weight:600;line-height:1.3;word-break:break-word;">{{.Site.Title}}</div>
    </td>
    <td valign="middle" style="background:#FDF6E3;padding:24px 28px;" data-content-background="#FDF6E3">
      <div style="font-size:11px;color:#268bd2;font-weight:600;letter-spacing:0.03em;margin-bottom:8px;">{{.Site.Hostname}}</div>
      <div style="width:32px;height:3px;background:#268bd2;margin-bottom:12px;"></div>
      {{if .Title}}
        <div style="font-size:20px;font-weight:700;color:#2d3c42;line-height:1.3;margin-bottom:8px;word-break:break-word;">{{.Title}}</div>
        {{if .Summary}}<div style="font-size:13px;color:#6c6c6c;line-height:1.5;word-break:break-word;">{{.Summary}}</div>{{end}}
      {{else}}
        <div style="font-size:20px;font-weight:700;color:#2d3c42;line-height:1.3;word-break:break-word;">{{.Summary}}</div>
      {{end}}
    </td>
  </tr>
</table>
</body>
</html>
