<table border="0" cellpadding="0" cellspacing="0" width="100%" height="315" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;" data-content-background="#FDF6E3" data-avatar-background="#2d3c42" data-avatar-url="{{.Site.Author.avatar}}">
  <tr>
    <td width="110" valign="middle" align="center" style="background:#2d3c42;padding:20px 12px;">
      <img src="{{.Site.Author.avatar}}" width="72" height="72" style="display:block;margin:0 auto 10px auto;">
      <div style="color:#fffcf2;font-size:11px;font-weight:bold;line-height:1.3;">{{.Site.Title}}</div>
    </td>
    <td valign="middle" style="background:#FDF6E3;padding:24px 28px;">
      <div style="font-size:11px;color:#268bd2;font-weight:bold;margin-bottom:8px;">{{.Site.Hostname}}</div>
      <div style="width:32px;height:3px;background:#268bd2;margin-bottom:12px;"></div>
      {{if .Title}}
        <div style="font-size:20px;font-weight:bold;color:#2d3c42;line-height:1.3;margin-bottom:8px;">{{.Title}}</div>
        {{if .Summary}}<div style="font-size:13px;color:#6c6c6c;line-height:1.5;">{{.Summary}}</div>{{end}}
      {{else}}
        <div style="font-size:18px;color:#2d3c42;line-height:1.4;">{{.Summary}}</div>
      {{end}}
    </td>
  </tr>
</table>
