<div data-avatar-background="#FDF6E3" data-content-background="#fffcf2" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; padding: 30px 30px 30px 20px; height: 315px; width: 420px; position: relative; overflow: hidden;">

  <div style="color: #b0a89a; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;">
    {{ .Site.Title }}
  </div>

  {{ if .Title }}
    <div style="color: #2d3c42; font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 14px;">
      {{ .Title }}
    </div>
    {{ if .Summary }}
      <div style="color: #6c6c6c; font-size: 14px; line-height: 1.55;">
        {{ .Summary }}
      </div>
    {{ end }}
  {{ else }}
    <div style="color: #2d3c42; font-size: 18px; line-height: 1.55;">
      {{ .Summary }}
    </div>
  {{ end }}

  <div style="position: absolute; bottom: 28px; left: 20px; right: 30px; border-top: 1px solid #d0c9bc; padding-top: 12px; color: #b0a89a; font-size: 12px;">
    {{ .Site.Hostname }}
  </div>

</div>
