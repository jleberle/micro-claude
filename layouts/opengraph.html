<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px;
    height: 315px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: #FDF6E3;
  }
  table { border-collapse: collapse; width: 600px; height: 315px; }
  .col-avatar {
    width: 110px;
    background: #2d3c42;
    vertical-align: middle;
    text-align: center;
    padding: 20px 12px;
  }
  .col-avatar img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: block;
    margin: 0 auto 10px auto;
    border: 2px solid #fffcf2;
  }
  .col-avatar .site-name {
    color: #fffcf2;
    font-size: 11px;
    font-weight: 600;
    word-break: break-word;
    line-height: 1.3;
  }
  .col-content {
    vertical-align: middle;
    padding: 24px 28px;
    background: #FDF6E3;
  }
  .hostname {
    font-size: 11px;
    color: #268bd2;
    font-weight: 600;
    text-transform: lowercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #2d3c42;
    line-height: 1.3;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .summary {
    font-size: 13px;
    color: #6c6c6c;
    line-height: 1.5;
    word-break: break-word;
  }
  .divider {
    display: block;
    width: 32px;
    height: 3px;
    background: #268bd2;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<table>
  <tr>
    <td class="col-avatar" data-avatar-background="#2d3c42">
      <img src="{{.Site.Author.avatar}}" alt="{{.Site.Author.name}}" data-avatar-url="{{.Site.Author.avatar}}">
      <div class="site-name">{{.Site.Title}}</div>
    </td>
    <td class="col-content" data-content-background="#FDF6E3">
      <div class="hostname">{{.Site.Hostname}}</div>
      <span class="divider"></span>
      {{if .Title}}
        <div class="title">{{.Title}}</div>
        {{if .Summary}}<div class="summary">{{.Summary}}</div>{{end}}
      {{else}}
        <div class="title">{{.Summary}}</div>
      {{end}}
    </td>
  </tr>
</table>
</body>
</html>
