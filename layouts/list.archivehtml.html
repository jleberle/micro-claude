{{ define "main" }}
  <h1 class="page-title">Archive</h1>

  {{ range (.Pages.GroupByDate "2006") }}
    <h2>{{ .Key }}</h2>
    <ul class="archive-list">
      {{ range .Pages }}
        <li class="archive-entry">
          <a href="{{ .Permalink }}">{{ .Title | default (.Date.Format "Jan 2") }}</a>
          <span class="archive-date">{{ .Date.Format "Jan 2" }}</span>
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
